name: Release

# Unsigned .ipa for sideloading (AltStore/SideStore). Tag `v*` → GitHub release; manual run → artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PATH_PREFIX: /opt/homebrew/bin
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  ipa:
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: export PATH="$PATH_PREFIX:$PATH" && make ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Notespace-ipa
          path: build/Notespace.ipa
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$PATH_PREFIX:$PATH"
          gh release create "$GITHUB_REF_NAME" build/Notespace.ipa --generate-notes
