name: Release

# Unsigned .ipa for sideloading (AltStore/SideStore). Tag `v*` → GitHub release; manual run → artifact only.
# Hosted `xcode-27` runner (see ci.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mac
      - name: Build .ipa
        run: |
          # Tag v1.2.3 → version 1.2.3; manual runs keep project.yml's version. Build = run number.
          VERSION=""; [[ "$GITHUB_REF" == refs/tags/v* ]] && VERSION="${GITHUB_REF_NAME#v}"
          make ipa VERSION="$VERSION" BUILD="${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Notespace-ipa
          path: |
            build/Notespace.ipa
            build/Notespace.dSYM.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Notespace.ipa build/Notespace.dSYM.zip --generate-notes
