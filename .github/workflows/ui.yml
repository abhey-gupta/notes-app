name: UI

# XCUI tests: slow (~12 min) and gesture-flaky, so not in the PR gate. Nightly, on demand, and on PRs
# that touch the app target or the tests themselves. Hosted `xcode-27` runner (see ci.yml).
on:
  schedule:
    - cron: "0 20 * * *"
  pull_request:
    paths: ["App/**", "Tests/UITests/**", "project.yml", ".github/workflows/ui.yml"]
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  ui:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mac
      - name: UI tests on iPad simulator
        run: |
          SIM=$(scripts/ci-sim.sh CI-iPad)
          make test-ui SIM="$SIM"
