name: UI

# XCUI tests: slow (~12 min) and gesture-flaky, so not in the PR gate. Nightly, on demand, and on PRs
# that touch the app target or the tests themselves.
on:
  schedule:
    - cron: "0 20 * * *"
  pull_request:
    paths: ["App/**", "Tests/UITests/**", "project.yml", ".github/workflows/ui.yml"]
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_PREFIX: /opt/homebrew/bin
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  ui:
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: UI tests on iPad simulator
        run: |
          export PATH="$PATH_PREFIX:$PATH"
          SIM=$(scripts/ci-sim.sh CI-iPad)
          make test-ui SIM="$SIM"
      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown CI-iPad 2>/dev/null || true
