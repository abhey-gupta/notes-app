name: CI

# PR-only: squash merges of green PRs don't re-run on main (single shared runner).
on:
  pull_request:
    paths-ignore: ["docs/**", "design/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_PREFIX: /opt/homebrew/bin
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  lint:
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: export PATH="$PATH_PREFIX:$PATH" && make lint

  packages:
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: export PATH="$PATH_PREFIX:$PATH" && make test-packages

  ios:
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Test on iPad simulator
        run: |
          export PATH="$PATH_PREFIX:$PATH"
          SIM=$(scripts/ci-sim.sh CI-iPad)
          make test SIM="$SIM"
      # Idle iOS 27 sims burn ~3-4 cores (SpringBoard/widgets); never leave one booted.
      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown CI-iPad 2>/dev/null || true
