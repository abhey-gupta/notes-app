name: CI

# PR gate on GitHub's hosted `xcode-27` runner (Apple Silicon, Xcode 27.1, iOS 27 simulators): one job, no
# XCUI tests (ui.yml). PR-only: squash merges of green PRs don't re-run on main.
# Minutes: macOS bills at 10× against the plan's included minutes; one run is ~20 min → ~200.
# The VM renders PencilKit in software; one render test hangs there and is skipped (see the step).
on:
  pull_request:
    paths-ignore: ["docs/**", "design/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  ci:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mac
      - name: Lint
        run: make lint
      - name: Headless packages
        run: make test-packages
      - name: DIAG InkEnginePencilKit tests with spindump on hang (temporary)
        run: |
          SIM=$(scripts/ci-sim.sh CI-iPad)
          xcodegen generate --quiet
          set -o pipefail; xcodebuild test -project Notespace.xcodeproj -scheme Notespace \
            -destination "platform=iOS Simulator,name=$SIM" -only-testing:InkEnginePencilKitTests \
            -collect-test-diagnostics on-failure -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 90 -maximum-test-execution-time-allowance 120 \
            -resultBundlePath build/diag.xcresult | xcbeautify
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-xcresult
          path: build/diag.xcresult
          if-no-files-found: ignore
