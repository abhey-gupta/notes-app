name: CI

# PR gate on GitHub's hosted `xcode-27` runner (Apple Silicon, Xcode 27.1, iOS 27 simulators): one job, no
# XCUI tests (ui.yml). PR-only: squash merges of green PRs don't re-run on main.
# Minutes: macOS bills at 10× against the plan's included minutes; one run is ~20 min → ~200.
# The VM renders PencilKit in software and `PKDrawing.image` hung there under parallel test execution
# (RenderTests), so tests run serially; InkEnginePencilKit suites allow 5 min (per-test allowance 300 s).
on:
  pull_request:
    paths-ignore: ["docs/**", "design/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  ci:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mac
      - name: Lint
        run: make lint
      - name: Headless packages
        run: make test-packages
      - name: Simulator tests (no UI tests)
        run: |
          SIM=$(scripts/ci-sim.sh CI-iPad)
          make test-unit SIM="$SIM" UNITFLAGS='-parallel-testing-enabled NO'
