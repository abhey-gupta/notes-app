name: CI

# PR gate on the single self-hosted runner: one job (no queueing between jobs), no XCUI tests (ui.yml).
# PR-only: squash merges of green PRs don't re-run on main.
on:
  pull_request:
    paths-ignore: ["docs/**", "design/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PATH_PREFIX: /opt/homebrew/bin
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  ci:
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: export PATH="$PATH_PREFIX:$PATH" && make lint
      - name: Headless packages
        run: export PATH="$PATH_PREFIX:$PATH" && make test-packages
      - name: Simulator tests (no UI tests)
        run: |
          export PATH="$PATH_PREFIX:$PATH"
          SIM=$(scripts/ci-sim.sh CI-iPad)
          make test-unit SIM="$SIM"
      # Idle iOS 27 sims burn ~3-4 cores (SpringBoard/widgets); never leave one booted.
      - name: Shut down simulator
        if: always()
        run: xcrun simctl shutdown CI-iPad 2>/dev/null || true
