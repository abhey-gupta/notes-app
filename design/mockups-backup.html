<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--blue:#2C4FD6;--ink:#1E2129;--fg2:#55585f;--fg3:#8a8c92;--ui:-apple-system,"SF Pro Text",system-ui,sans-serif;
 --grp:#F2F2F7;--cell:#fff;--sep:rgba(60,60,67,.18);--green:#34A853;--amber:#C98A14;--red:#D2402F;--paper:#FCFBF7;--desk:#EDEAE4}
body{font-family:var(--font-sans,var(--ui))}
.wrap{display:flex;flex-direction:column;gap:34px}
.cap{margin:0 0 10px 2px}
.cap b{font-size:15px;color:var(--foreground,#111)}
.cap span{display:block;font-size:13px;color:var(--muted-foreground,#666);margin-top:3px;line-height:1.45;max-width:900px}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.sub{font:500 12px var(--font-sans,var(--ui));color:var(--muted-foreground,#666);margin:6px 0 0 2px}
/* popover */
.pop{width:340px;background:var(--grp);border-radius:18px;overflow:hidden;font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;box-shadow:0 20px 50px -14px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.12);position:relative}
.pop.h{height:500px}
.nav{height:48px;display:flex;align-items:center;padding:0 10px;font:600 16px var(--ui);position:relative}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--blue);font:400 16px var(--ui);position:absolute;left:8px}
.nav .title{flex:1;text-align:center}
.nav .act{position:absolute;right:14px;color:var(--blue);font:400 16px var(--ui)}
.sec{margin:12px 16px 0}
.hd{font:400 12.5px var(--ui);color:var(--fg2);text-transform:uppercase;letter-spacing:.3px;margin:0 0 6px 16px}
.ft{font:400 12.5px var(--ui);color:var(--fg2);margin:7px 16px 0;line-height:1.4}
.grpbox{background:var(--cell);border-radius:11px;overflow:hidden}
.cl{min-height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;font:400 16px var(--ui);position:relative}
.cl+.cl::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.cl .lab{flex:1;min-width:0}
.cl .val{color:var(--fg2);font-size:16px}
.cl .chev{color:#c4c4c8;font-size:17px;font-weight:600}
.cl.btn{color:var(--blue)}
.cl.dim{color:var(--fg3)}
.tg{width:51px;height:31px;border-radius:16px;background:#e9e9eb;position:relative;flex:none}
.tg i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)}
.tg.on{background:var(--green)}.tg.on i{left:22px}
.pbar{height:3px;border-radius:2px;background:rgba(60,60,67,.12);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:38%;background:var(--blue);border-radius:2px}
.stat{display:flex;flex-direction:column;gap:3px;padding:10px 16px 11px}
.stat b{font:500 15px var(--ui)}
.stat small{font:400 13px var(--ui);color:var(--fg2)}
.sym{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
/* restore rows */
.cov{width:26px;height:34px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.1);position:relative}
.cov::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.4)}
.rt{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.rt b{font:500 15.5px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{font:400 12.5px var(--ui);color:var(--fg2)}
.pill{height:28px;padding:0 12px;border-radius:14px;display:flex;align-items:center;font:600 13.5px var(--ui);background:rgba(44,79,214,.1);color:var(--blue);flex:none}
.pill.ok{background:transparent;color:var(--fg2);font-weight:400;padding:0;font-size:13px}
.pill.done{background:transparent;color:var(--green);padding:0}
/* library */
.lib{width:720px;height:420px;border-radius:26px;background:var(--desk);position:relative;overflow:hidden;font-family:var(--ui);color:var(--ink);border:8px solid #0E0E10;box-sizing:content-box}
.lhdr{position:absolute;top:30px;left:30px;right:30px;display:flex;align-items:center;gap:10px}
.lhdr h1{font:600 30px Georgia,"Times New Roman",serif;margin:0;flex:1}
.gl{background:rgba(255,255,255,.74);backdrop-filter:blur(20px);border:.5px solid rgba(0,0,0,.07);box-shadow:0 8px 24px -8px rgba(20,20,30,.16)}
.circ{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#3a3d45}
.srch{height:40px;width:220px;border-radius:20px;display:flex;align-items:center;padding:0 14px;font:400 14px var(--ui);color:var(--fg3)}
.card{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:360px;border-radius:22px;padding:26px 26px 22px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.card h2{font:600 18px var(--ui);margin:6px 0 0}
.card p{font:400 14px var(--ui);color:var(--fg2);margin:0 0 8px;line-height:1.4}
.card .acts{display:flex;gap:10px}
.cb{height:40px;padding:0 20px;border-radius:20px;display:flex;align-items:center;font:600 14.5px var(--ui)}
.cb.pro{background:var(--ink);color:#fff}.cb.sec{background:rgba(30,33,41,.07);color:var(--ink)}
.empty{position:absolute;left:0;right:0;top:50%;text-align:center;font:400 15px var(--ui);color:var(--fg3)}
.badgeup{position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;background:var(--blue);display:grid;place-items:center}
/* library header mocks (05) */
.hwrap{display:flex;flex-direction:column;gap:22px}
.hcap{font:600 13px var(--font-sans,var(--ui));color:var(--foreground,#111);margin:0 0 6px 2px}
.hcap span{font-weight:400;color:var(--muted-foreground,#666)}
.hfit{position:relative;width:716px;height:168px}
.hscr{position:absolute;left:0;top:0;width:1194px;height:280px;transform:scale(.6);transform-origin:0 0;background:#F2F1EC;border-radius:28px;overflow:hidden;font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.hbar{position:absolute;top:44px;left:44px;right:40px;display:flex;align-items:center;gap:14px}
.htitle{font:400 44px "New York","Iowan Old Style",Georgia,serif;letter-spacing:-.5px;flex:1}
.htitle small{display:block;font:500 13px var(--ui);color:#7a7c82;letter-spacing:0;margin-top:6px;display:flex;align-items:center;gap:10px}
.hline{width:120px;height:2px;border-radius:1px;background:rgba(60,60,67,.14);overflow:hidden}.hline i{display:block;height:100%;width:38%;background:var(--blue)}
.hsearch{width:250px;height:44px;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 16px;font:400 16px var(--ui);color:#8a8c92;box-sizing:border-box;position:relative;overflow:hidden;background:rgba(255,255,255,.7);border:.5px solid rgba(0,0,0,.08);box-shadow:0 6px 18px -8px rgba(20,20,30,.18)}
.hsearch .bar{position:absolute;left:14px;right:14px;bottom:5px;height:2px;border-radius:1px;background:rgba(60,60,67,.12)}.hsearch .bar i{display:block;height:100%;width:42%;background:var(--blue);border-radius:1px}
.hcirc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#3a3d45;position:relative;flex:none;background:rgba(255,255,255,.7);border:.5px solid rgba(0,0,0,.08);box-shadow:0 6px 18px -8px rgba(20,20,30,.18)}
.hdot{position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px #F2F1EC}
.hnew{height:44px;border-radius:22px;padding:0 20px 0 16px;background:#1E2129;color:#fff;display:flex;align-items:center;gap:8px;font:600 17px var(--ui)}
.hsec{position:absolute;top:140px;left:44px;font:600 13px var(--ui);letter-spacing:.6px;color:#7a7c82}
.hcards{position:absolute;top:168px;left:44px;display:flex;gap:28px}
.hcard{width:294px}
.hthumb{height:62px;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06);background-image:radial-gradient(circle,rgba(30,33,41,.14) 1px,transparent 1.3px);background-size:16px 16px}
.hcard b{display:block;font:600 16px var(--ui);margin-top:10px}
.hcard small{display:flex;align-items:center;gap:6px;font:400 14px var(--ui);color:#7a7c82;margin-top:3px}
.hcard .up{color:var(--blue);display:inline-flex;align-items:center;gap:4px}
@keyframes drift{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-1.5px)}}
.drift{animation:drift 1.6s ease-in-out infinite}
</style></head><body>
<div class="wrap" id="root"></div>
<script>
const I={
cloud:'<path d="M7.5 18.5h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.4 9.6 4.5 4.5 0 0 0 7.5 18.5z"/>',
cloudup:'<path d="M7.5 18.5h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.4 9.6 4.5 4.5 0 0 0 7.5 18.5z"/><path d="M12 16v-5.5M9.6 12.8 12 10.4l2.4 2.4"/>',
check:'<path d="M5 12.5 9.5 17 19 7.5"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
drive:'<path d="M8.6 4h6.8l5.6 9.8-3.4 5.7H6.4L3 13.8z"/><path d="M3 13.8h18M8.6 4l5.6 9.8M15.4 4 9.8 13.8M6.4 19.5l3.4-5.7"/>'};
const sym=(n,s='')=>`<svg class="sym" style="${s}" viewBox="0 0 24 24">${I[n]}</svg>`;
const hdr=(k,t,d,o)=>{
 const search=o.search?`<div class="hsearch">${sym('cloudup','width:20px;height:20px;color:#3a3d45')}<span style="color:#3a3d45">Backing up Thermodynamics…</span><div class="bar"><i></i></div></div>`:`<div class="hsearch">${sym('search','width:19px;height:19px')}Search notebooks</div>`;
 const cloudBtn=o.cloudBtn?`<div class="hcirc">${sym('cloudup','width:22px;height:22px;color:#2C4FD6')}</div>`:'';
 const gear=`<div class="hcirc">${sym('gear','width:21px;height:21px')}${o.dot?'<span class="hdot"></span>':''}</div>`;
 const title=`<div class="htitle">Library${o.sub?`<small>Backing up Thermodynamics · 3 of 14 <span class="hline"><i></i></span></small>`:''}</div>`;
 const card=(n,s,up)=>`<div class="hcard"><div class="hthumb"></div><b>${n}</b><small>${s}${up?`<span class="up">${sym('cloudup','width:15px;height:15px;stroke-width:2')}</span>`:''}</small></div>`;
 return `<div><div class="hcap">${k} · ${t} <span>— ${d}</span></div><div class="hfit"><div class="hscr">
 <div class="hbar">${title}${search}${cloudBtn}${gear}<div class="hnew">${sym('plus','width:18px;height:18px;stroke:#fff;stroke-width:2.2')}New</div></div>
 <div class="hsec">CONTINUE</div><div class="hcards">${card('Thermodynamics','Edited 2 min ago · 11 pages',o.cover)}${card('Product Specs','Yesterday · 4 pages',0)}${card('Studio Journal','Tue · 31 pages',0)}</div></div></div></div>`;};
const cap=(t,s)=>`<div class="cap"><b>${t}</b><span>${s}</span></div>`;
const tg=on=>`<div class="tg ${on?'on':''}"><i></i></div>`;
const cell=(lab,right='',cls='')=>`<div class="cl ${cls}"><div class="lab">${lab}</div>${right}</div>`;
const sec=(hd,body,ft='')=>`<div class="sec">${hd?`<div class="hd">${hd}</div>`:''}<div class="grpbox">${body}</div>${ft?`<div class="ft">${ft}</div>`:''}</div>`;
const gestures=sec('Gestures',cell('Tap to undo',tg(1))+cell('Hold to snap shapes',tg(1))+cell('Hold to erase',tg(1)),'Tap with two fingers to undo, three to redo. Hold the Pencil still at a stroke’s end to make it a perfect shape, or where it touches down to erase until you lift it.');
const pages=sec('Pages',cell('New pages','<span class="val">Manual</span><span class="chev">›</span>'),'Automatic adds a page when you write on the last one.');
const display=sec('Display',cell('Hide status bar',tg(0)),'Hides the time and battery everywhere in Notespace.');
const version=sec('',cell('Version','<span class="val">0.1.1</span>'));

// Backup section variants
const backup=(st,opts={})=>{
 const on=st!=='off';
 const where=opts.drive?'Google Drive › Notespace':'iCloud Drive › Notespace';
 let rows=on?cell('Backup folder',`<span class="val">${where}</span><span class="chev">›</span>`):cell('Choose Backup Folder…','','btn');
 if(on){
  if(st==='busy') rows+=`<div class="cl"><div class="stat" style="padding-left:0"><b>Backing up Thermodynamics…</b><small>3 of 14 notebooks · 2.1 MB left</small><div class="pbar"><i></i></div></div></div>`;
  rows+=cell('Back Up Now','',st==='busy'?'dim':'btn');
  rows+=cell('Restore…','<span class="chev">›</span>');
 }
 const ft={
  off:'Pick a folder in Files — iCloud Drive, Google Drive, Dropbox… Notebooks are copied there as you write, so a new iPad can pick up where this one left off.',
  ok:'Up to date. Last backup 2 minutes ago · 14 notebooks, 86 MB.',
  busy:'Only pages you changed are copied. Writing is never interrupted.',
  wait:'Copied. iCloud Drive is still uploading 3 notebooks. Files are safe on this iPad meanwhile.',
  full:'iCloud storage is full. Backups will resume once space is free. <span style="color:var(--blue)">Manage Storage</span>',
  nosign:'The backup folder was moved or deleted. Choose it again to continue.'}[st];
 return sec('Backup',rows,ft);
};
const popSettings=(st,opts={})=>`<div class="pop">${gestures}${pages}${display}${backup(st,opts)}${version}<div style="height:14px"></div></div>`;

// restore page
const cov=c=>`<div class="cov" style="background:${c}"></div>`;
const nb=(c,t,s,right)=>`<div class="cl" style="min-height:56px">${cov(c)}<div class="rt"><b>${t}</b><small>${s}</small></div>${right}</div>`;
const restore=(variant)=>{
 const list=[
  ['#2C4FD6','Thermodynamics','11 pages · Physics · Yesterday',`<span class="pill">Restore</span>`],
  ['#D2402F','Linear Algebra','6 pages · Maths · 28 Oct',variant==='doing'?`<span class="pill done">${sym('check','width:18px;height:18px')}</span>`:`<span class="pill">Restore</span>`],
  ['#1E2129','Sketchbook','48 pages · 27 Oct',`<span class="pill">Restore</span>`],
  ['#3C8C5A','Meeting notes','3 pages · 21 Oct',`<span class="pill">Restore</span>`],
  ['#C98A14','Recipes','9 pages · 12 Oct',`<span class="pill ok">On this iPad</span>`],
  ['#7A5AB8','Travel 2026','14 pages · 2 Oct',`<span class="pill ok">On this iPad</span>`]];
 return `<div class="pop h"><div class="nav"><div class="back"><span style="font-size:22px;line-height:1;margin-top:-3px">‹</span> Back</div><div class="title">Restore</div><div class="act">Restore All</div></div>
 ${sec('In iCloud · 14 notebooks',list.map(a=>nb(...a)).join(''),'Notebooks already on this iPad are skipped. Folders come back as they were. Restoring never changes what is on this iPad.')}</div>`;
};

// library empty state
const lib=(withCard,upIcon)=>`<div class="lib"><div class="lhdr"><h1>Library</h1><div class="srch gl">Search</div><div class="circ gl" style="position:relative">${sym('gear','width:19px;height:19px')}${upIcon?`<span class="badgeup">${sym('cloudup','width:9px;height:9px;stroke:#fff;stroke-width:2.6')}</span>`:''}</div><div class="circ gl">${sym('plus','width:19px;height:19px')}</div></div>
 ${withCard?`<div class="card gl">${sym('cloud','width:34px;height:34px;color:#3a3d45')}<h2>14 notebooks in iCloud</h2><p>Backed up from Abhey’s iPad Pro, yesterday.</p><div class="acts"><div class="cb pro">Restore all</div><div class="cb sec">Choose…</div></div></div>`:`<div class="empty">No notebooks yet. Tap + to start one.</div>`}</div>`;

document.getElementById('root').innerHTML=`
<div>${cap('01 · Settings › Backup (folder chosen, idle)','New section between Display and Version in the existing settings popover. The destination is a folder you pick once in Files (iCloud Drive or Google Drive both appear there) — no iCloud entitlement needed, so it works on a free developer account. Rows: Backup folder, Back Up Now, Restore. Status lives in the footer, where iOS’s own iCloud Backup puts it: nothing new in the library.')}
<div class="row">${popSettings('ok')}${popSettings('off')}</div>
<div class="sub">left: folder chosen, up to date · right: nothing chosen yet (one blue row; footer explains)</div></div>

<div>${cap('02 · States while it works','Backing up: a thin determinate hairline inside the section, name of the notebook being copied, "Back Up Now" greys out. Still uploading / iCloud full / folder gone are footer text only, one line each. No spinners, no alerts, no badges.')}
<div class="row">${popSettings('busy')}${popSettings('wait')}</div>
<div class="row" style="margin-top:18px">${popSettings('full')}${popSettings('nosign')}</div></div>

<div>${cap('03 · Restore (pushed inside the popover)','Settings › Restore… pushes this list; the popover stays put. Rows: cover colour, title, pages · folder · backup date. Tap Restore on one, or Restore All in the nav. Notebooks already on this iPad are listed but inert ("On this iPad"). A restored row flips to a ✓ and the notebook appears in the library behind the popover at once.')}
<div class="row">${restore('idle')}${restore('doing')}</div>
<div class="sub">left: fresh list · right: after restoring Linear Algebra</div></div>

<div>${cap('04 · Fresh iPad: offer in the empty library','On a device whose library is empty while a backup exists, the empty state becomes a glass card. "Restore all" brings everything back with folders; "Choose…" opens the list from 03. The card never appears once the library has a notebook.')}
<div class="row">${lib(true,false)}</div></div>

<div>${cap('05 · Library chrome while a backup is uploading — six options','All transient: appear only while files are still going up, gone within a second of finishing. A = baseline. Real header geometry (serif title · search capsule · gear · New).')}
<div class="hwrap">${hdr('A','Nothing (baseline)','State lives in Settings only. Zero new pixels in the library.',{})}
${hdr('B','Dot on the gear','A 7 pt blue dot on the settings circle while uploading. Tap gear → Settings opens on Backup. Smallest possible signal; says "something is happening", not what.',{dot:1})}
${hdr('C','Cloud button slides in beside the gear','A glass circle with a cloud-arrow appears between search and gear, arrow drifting up slowly; it fades and the row closes up when done. Tap → Settings › Backup. Readable at a glance, still one glyph.',{cloudBtn:1})}
${hdr('D','Quiet line under the title','"Backing up Thermodynamics · 3 of 14" in the caption grey, with a 120 pt hairline. Replaced by "Backed up just now" for 2 s, then gone. Most informative; adds a line of text to the calmest part of the screen.',{sub:1})}
${hdr('E','Search capsule shows it','The search field’s placeholder becomes "Backing up Thermodynamics…" with a hairline along the capsule’s bottom edge, then "Backed up ✓" for a beat, then back to Search. Uses existing chrome (Mail’s "Checking for Mail…" pattern). Tap still searches.',{search:1})}
${hdr('F','On the notebook itself','A tiny cloud-arrow after the page count of the notebooks being copied right now, nothing in the header. Shows exactly what is going up; invisible when the notebook is off screen.',{cover:1})}
</div></div>
<div>${cap('06 · Google Drive as the folder','Same section, same engine: the folder row just reads Google Drive › Notespace. Needs the Google Drive app installed and signed in (it is the Files provider that uploads).')}
<div class="row">${popSettings('ok',{drive:true})}</div></div>
`;
</script>
</body></html>
