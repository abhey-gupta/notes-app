# Throwaway latency spike (#16). Not part of the app; not merged.
#   cd spikes/ink-latency && xcodegen generate && open InkLatencySpike.xcodeproj
name: InkLatencySpike
options:
  bundleIdPrefix: com.abhey
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    DEVELOPMENT_TEAM: 7SBKK4A99S
    CODE_SIGN_STYLE: Automatic

packages:
  InkModel: { path: ../../Packages/InkModel }
  InkGeometry: { path: ../../Packages/InkGeometry }
  Perf: { path: ../../Packages/Perf }

targets:
  InkLatencySpike:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: InkModel
      - package: InkGeometry
      - package: Perf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhey.notespace.spike.inklatency
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Ink Latency
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  InkLatencySpike:
    build:
      targets:
        InkLatencySpike: all
    run:
      # Release: latency numbers from an unoptimized build are meaningless.
      config: Release
